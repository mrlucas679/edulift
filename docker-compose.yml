# Local development and tests only. Production uses Amazon RDS (ADR-0005).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edulift
      POSTGRES_USER: edulift
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-edulift_local_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - edulift-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edulift -d edulift"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  edulift-pg:
